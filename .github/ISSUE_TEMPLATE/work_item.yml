name: Improvement or research
description: Propose a client improvement or a focused research question; use the research label for research-only work.
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the capability to improve or the question research should answer.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define the APIs, protocols, models, and behavior included or excluded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "Use - [ ] checkboxes for observable outcomes. For research, include the evidence and decision the work should enable."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Describe checks or hardware/app evidence needed. Distinguish live, simulated, and app-derived evidence.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link source tracker IDs, related issues or PRs, docs, fixtures, and dependencies. Link HA-owned work instead of duplicating it.
    validations:
      required: false
