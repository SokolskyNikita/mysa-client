<svg xmlns="http://www.w3.org/2000/svg" width="480" height="80" viewBox="0 0 480 80" role="img" aria-labelledby="progress-title progress-description">
  <title id="progress-title">60.9% of known Mysa API operations fully implemented (67/110)</title>
  <desc id="progress-description">Only fully implemented operations count toward completion. Partial and missing operations remain in the unfilled portion.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, sans-serif; }
    .label { fill: #34433c; font-size: 15px; font-weight: 600; }
    .value { fill: #216e4e; font-size: 18px; font-weight: 650; }
    .caption { fill: #596960; font-size: 13px; }
    .track { fill: #e6ece8; }
    .fill { fill: #27845a; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #dce7df; }
      .value { fill: #7bd6a4; }
      .caption { fill: #a1b4a8; }
      .track { fill: #293b31; }
      .fill { fill: #56b985; }
    }
  </style>
  <defs>
    <clipPath id="bar"><rect x="0" y="34" width="480" height="10" rx="5" /></clipPath>
  </defs>
  <text class="label" x="0" y="20">API implementation</text>
  <text class="value" x="480" y="20" text-anchor="end">60.9%</text>
  <rect class="track" x="0" y="34" width="480" height="10" rx="5" />
  <rect class="fill" x="0" y="34" width="292.36" height="10" rx="5" clip-path="url(#bar)" />
  <text class="caption" x="0" y="67">67 of 110 operations fully implemented</text>
</svg>
