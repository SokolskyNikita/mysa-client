[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mysa-client"
version = "0.1.0"
description = "Unofficial async cloud and HomeKit clients for Mysa thermostats; unaffiliated with Mysa. Use at your own risk."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikita Sokolsky" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.11,<4"]

[project.optional-dependencies]
homekit = [
    "aiohomekit>=4.0.1,<5",
    "cryptography>=48.0.1",
    "zeroconf>=0.149.16",
]

[project.urls]
Repository = "https://github.com/SokolskyNikita/mysa-client"
Issues = "https://github.com/SokolskyNikita/mysa-client/issues"
Changelog = "https://github.com/SokolskyNikita/mysa-client/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "aioresponses>=0.7.8,<0.8",
    "pycognito==2024.5.1",
]
lint = ["ruff==0.17.0", "mypy==2.4.0"]
build = ["build>=1.2,<2", "twine>=7,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mysa_client"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/docs", "/tools", "/.github/workflows", "/.gitignore",
    "/pyproject.toml", "/README.md", "/CHANGELOG.md", "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:pycognito.*"]

[tool.coverage.run]
source = ["mysa_client"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/mysa_client"]
untyped_calls_exclude = ["aiohomekit"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# A subset of Home Assistant core's rule set.
select = [
    "A", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "F", "FLY", "G", "I", "ICN",
    "INP", "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PYI", "RET",
    "RSE", "RUF", "S", "SIM", "SLF", "T20", "TID", "TRY", "UP", "W",
]
ignore = [
    "D202",    # blank line after function docstring (formatter decides)
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "D401",    # noun-phrase docstrings read fine for properties and helpers
    "E501",    # the formatter handles line length
    "ISC001",  # conflicts with the formatter
    "PLC0415", # local imports are used deliberately
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "RUF012",  # HA's _attr_ class attributes
    "S101",    # asserts narrow types, as in HA core
    "TRY003",
    "TRY400",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components", "mysa_client"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001", "D103", "S105", "S106", "INP001"]
"examples/**" = ["T201", "INP001", "D100", "S"]
"tools/**" = ["T201", "INP001", "D100", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
